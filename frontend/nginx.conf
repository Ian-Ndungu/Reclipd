server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 2049m;
  client_body_timeout 300s;
  error_page 413 = @upload_too_large;
  location @upload_too_large {
    default_type application/json;
    return 413 '{"detail":"Upload exceeds the server size limit. Choose a smaller file."}';
  }
  add_header X-Content-Type-Options nosniff;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com; media-src 'self' blob:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_request_buffering off; proxy_buffering off; proxy_send_timeout 300s; proxy_read_timeout 300s; }
  location / { try_files $uri $uri/ /index.html; }
}
