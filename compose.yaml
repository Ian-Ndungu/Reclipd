services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reclipd
      POSTGRES_USER: reclipd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reclipd-local-dev}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U reclipd -d reclipd"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 15
  api:
    init: true
    pids_limit: 256
    build: ./backend
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["127.0.0.1:8000:8000"]
    volumes: [media:/data]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 12
  worker:
    init: true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    build: ./backend
    env_file: .env
    command: celery -A app.worker.celery worker --loglevel=INFO --concurrency=1
    volumes: [media:/data]
    depends_on:
      api: {condition: service_healthy}
  beat:
    build: ./backend
    env_file: .env
    command: celery -A app.worker.celery beat --loglevel=INFO --schedule=/tmp/celerybeat
    volumes: [media:/data]
    depends_on:
      api: {condition: service_healthy}
  web:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres:
  redis:
  media:
